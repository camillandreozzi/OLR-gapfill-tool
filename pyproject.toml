[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clara-olr-gapfill"
version = "0.1.0"
description = "Gap-filled monthly maps of CLARA (NorSat-1) night-side OLR from ERA5 with a sparse spatio-temporal Gaussian process"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Camilla Andreozzi" }]
requires-python = ">=3.11"
keywords = ["outgoing longwave radiation", "CLARA", "NorSat-1", "ERA5", "Gaussian process", "gap filling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyarrow>=14",
    "xarray>=2023.12",
    "netCDF4>=1.6",
    "pyproj>=3.6",
    "matplotlib>=3.8",
    "torch>=2.2",
]

[project.optional-dependencies]
maps = ["cartopy>=0.22"]   # Robinson maps with coastlines (plain lat-lon axes without it)
era5 = ["cdsapi>=0.7.2"]   # download-era5
dev = ["pytest>=8"]

[project.scripts]
clara-gapfill = "clara_gapfill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clara_gapfill = ["default_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
